schemaVersion: archcontext.node/v2
id: component.evals-checks.ci-report-core
kind: component
name: CI Report Core
status: active
parent: capability.verification.evals-checks
layer: core
summary: Holds the JUnit report parser, the test result types, the test capability projection schema, the CI repair issue keys that the CI scripts, the board and the operator read, and the read model of the lessons ledger with the promotion candidate ids.
responsibilities:
  - Parse a JUnit report into one test file result and decode the test capability projection with exact fields.
  - Own the CI repair and daily-missing issue key prefixes and the issue body marker.
  - Own the rule registry and the TestBudget evaluation, exception parser and result document (ADR-0004).
  - Own the rules status document: the strict decoder of the maintenance-triage JSON, the theme governance and actions, and the candidate id digest.
source:
  include:
    - src/core/ci/**
