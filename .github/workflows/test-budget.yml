name: Test budget

# ADR-0004: the producer of the TestBudget result. `edited` refreshes the result
# after a PR body change without a full CI run; its own group keeps an `edited`
# run from cancelling the CI workflow.
on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: test-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-budget:
    name: Test budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The policy comes from the base commit; the result document is the notice annotation and the job summary is its human view.
      - name: Check the test budget
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -j '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.md"
          bun src/cli/index.ts rules check TestBudget --base "$BASE_SHA" --head "$HEAD_SHA" --body-file "$RUNNER_TEMP/pr-body.md" --github-annotation --github-summary "$GITHUB_STEP_SUMMARY"
